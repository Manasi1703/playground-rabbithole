<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #faf8f4;
    --ink: #000;
    --ink-soft: #1e1e1e;
    --muted: #6e6e68;
    --green: #3a5a40;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif: "Libre Caslon Text", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  #webgl {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    background:
      radial-gradient(120% 85% at 50% 50%, rgba(0,0,0,0) 55%, rgba(41,35,24,0.14) 100%);
  }

  header.topbar {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    pointer-events: none;
  }
  header.topbar .mark {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    text-transform: lowercase;
  }
  header.topbar .nav {
    display: flex;
    gap: 22px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .title-block {
    position: fixed;
    z-index: 55;
    left: 28px;
    bottom: 28px;
    pointer-events: none;
    max-width: 560px;
  }
  .title-block .eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 10px;
  }
  .title-block h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(32px, 5vw, 68px);
    line-height: 0.98;
    margin: 0 0 12px 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .title-block h1 em {
    font-style: italic;
    color: var(--green);
  }
  .title-block p {
    margin: 0;
    max-width: 380px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .scroll-hint {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 55;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .scroll-hint .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  /* Hover overlay that follows the cursor */
  #overlay {
    position: fixed;
    z-index: 70;
    left: 0; top: 0;
    width: 340px;
    background: rgba(10, 9, 6, 0.88);
    color: var(--cream);
    padding: 18px 20px;
    border-radius: 4px;
    pointer-events: none;
    transform: translate3d(-9999px, -9999px, 0);
    opacity: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
  }
  #overlay .tags {
    display: flex;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.8;
    margin-bottom: 8px;
  }
  #overlay .tags span + span::before {
    content: "·";
    margin-right: 10px;
    opacity: 0.6;
  }
  #overlay h3 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
    line-height: 1.2;
  }
  #overlay p {
    font-size: 12.5px;
    line-height: 1.5;
    margin: 0 0 10px 0;
    opacity: 0.92;
  }
  #overlay .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(250,248,244,0.15);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  #overlay .meta-row .arrow::after { content: " →"; }

  /* Cursor feedback when hovering a card */
  body.card-hover { cursor: none; }
  .cursor-dot {
    position: fixed;
    z-index: 65;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .2s ease;
    mix-blend-mode: difference;
  }
  body.card-hover .cursor-dot { opacity: 1; }
  body.modal-open .cursor-dot,
  body.modal-open .scroll-hint { display: none; }

  /* ---- Click-to-expand project modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(8, 7, 5, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition:
      opacity .35s ease,
      visibility 0s linear .35s,
      background-color .35s ease,
      backdrop-filter .35s ease,
      -webkit-backdrop-filter .35s ease;
  }
  .modal-backdrop.open {
    opacity: 1;
    visibility: visible;
    background: rgba(8, 7, 5, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition:
      opacity .35s ease,
      visibility 0s,
      background-color .35s ease,
      backdrop-filter .35s ease,
      -webkit-backdrop-filter .35s ease;
  }
  .modal-frame {
    position: relative;
    width: min(1120px, 92vw);
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    background: #0d0b08;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7);
    transform: translateY(16px) scale(0.98);
    opacity: 0;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s ease;
  }
  .modal-backdrop.open .modal-frame {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .modal-video {
    width: 100%;
    max-height: 74vh;
    background: #000;
    display: block;
  }
  .modal-caption {
    padding: 18px 24px 22px 24px;
    color: var(--cream);
    font-family: var(--sans);
    background: #111;
    border-top: 1px solid rgba(250,248,244,0.08);
  }
  .modal-caption .tags {
    display: flex;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.75;
    margin-bottom: 6px;
    color: var(--cream);
  }
  .modal-caption .tags span + span::before {
    content: "·";
    margin-right: 10px;
    opacity: 0.6;
  }
  .modal-caption h3 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modal-caption p {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    opacity: 0.88;
    max-width: 720px;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(250,248,244,0.22);
    background: rgba(10,9,6,0.55);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .modal-close:hover {
    background: rgba(30, 28, 22, 0.85);
    border-color: rgba(250,248,244,0.5);
    transform: scale(1.05);
  }
  .modal-close:focus { outline: 2px solid var(--green); outline-offset: 2px; }
  .modal-hint {
    position: absolute;
    left: 18px;
    bottom: 18px;
    z-index: 2;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(250,248,244,0.55);
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="webgl"></canvas>

<header class="topbar">
  <div class="mark">manasi ghutukade · playground</div>
  <div class="nav">WORK &nbsp;·&nbsp; RESUME &nbsp;·&nbsp; PLAYGROUND &nbsp;·&nbsp; ABOUT</div>
</header>



<div class="scroll-hint"><span class="dot"></span>scroll to walk</div>

<div id="overlay">
  <div class="tags" id="ov-tags"></div>
  <h3 id="ov-title"></h3>
  <p id="ov-desc"></p>
  <div class="meta-row">
    <span id="ov-kind"></span>
    
  </div>
</div>
<div class="cursor-dot" id="cursor"></div>

<div class="vignette"></div>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal-frame" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <video class="modal-video" id="modal-video" playsinline controls></video>
    <button class="modal-close" id="modal-close" aria-label="Close and keep walking">×</button>
    <span class="modal-hint">esc · click outside · to close</span>
    <div class="modal-caption">
      <div class="tags" id="modal-tags"></div>
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

// ---- Project metadata — each entry points to a real video in ./projects/ ----
const PROJECTS = [
  { file: "cats cradle simulator in cursor.mp4",
    tags: ["EXPERIMENT", "CURSOR × GEMINI"], title: "cat's cradle simulator",
    desc: "A browser toy that recreates the finger-string games I grew up with. Built on a weekend with Cursor and Gemini.",
    kind: "Web toy" },
  { file: "virtual tamagotchi.mp4",
    tags: ["TOY", "CURSOR × CHATGPT"], title: "virtual tamagotchi",
    desc: "A pocket pet that sulks if you ignore it. Mostly an excuse to design expressive pixel states for a tiny LCD screen.",
    kind: "Motion · Interactive" },
  { file: "virtual gramophone.mp4",
    tags: ["AUDIO TOY", "LOVABLE"], title: "virtual gramophone",
    desc: "Drop a record, lower the needle, listen. A study in how much warmth a single skeuomorphic detail can carry.",
    kind: "Web toy" },
  { file: "portfoliothreejs (1).mp4",
    tags: ["PORTFOLIO", "BLENDER · THREEJS"], title: "interactive portfolio",
    desc: "A walk-through portfolio you steer with your cursor. Every room is a case study, every light cue is a hint at what's next.",
    kind: "Motion · Web" },
  { file: "it themed Unity Game.mp4",
    tags: ["UNITY", "GAME"], title: "find-the-object, IT-style",
    desc: "A spooky scene inspired by the film IT. Your cursor is a torch; the balloons are all somewhere they shouldn't be.",
    kind: "Motion · Game" },
  { file: "a doctor roleplay robot.mp4",
    tags: ["AI", "ROLEPLAY"], title: "a doctor roleplay robot",
    desc: "A chatbot that pretends to be a doctor in training. A study in empathy, disclaimers, and how tone changes a clinical conversation.",
    kind: "AI experiment" },
  { file: "a gif created using Google Flow and a stpritesheet.mp4",
    tags: ["MOTION", "GOOGLE FLOW · SPRITE SHEET"], title: "a sprite-sheet gif",
    desc: "A looping gif assembled from a single sprite sheet, animated through Google Flow. Pocket-sized kinetic design.",
    kind: "Motion study" },
  { file: "an idea for substack readers.mp4",
    tags: ["CONCEPT", "SUBSTACK"], title: "an idea for Substack readers",
    desc: "A quiet concept for the reader's side of Substack: slower scrolling, warmer re-entry, fewer aggressive prompts.",
    kind: "Product concept" },
  { file: "experimenting with Unicorn Studio.mp4",
    tags: ["MOTION", "UNICORN STUDIO"], title: "experimenting with Unicorn Studio",
    desc: "Small motion test-beds built in Unicorn Studio — fluid shaders, lively interactions, the kind of thing you want to live in the corner of a page.",
    kind: "Motion study" },
  { file: "Animation_walking_through_202604081626.mp4",
    tags: ["ANIMATION", "STUDY"], title: "walking-through animation",
    desc: "A first-person walking study, frame by frame. The reference that, in part, led to this very rabbithole.",
    kind: "Animation" },
];

// ---- Deterministic-ish PRNG for a stable scatter each reload ----
let _seed = 20260418;
const rng = () => { _seed = (_seed * 9301 + 49297) % 233280; return _seed / 233280; };
const rand = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

// ---- Scene setup ----
const CREAM = 0xfaf8f4;
const canvas = document.getElementById("webgl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(CREAM, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CREAM);
// Fog makes distant cards melt into the cream background — gives the corridor
// depth without needing explicit walls.
scene.fog = new THREE.FogExp2(CREAM, 0.018);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
camera.position.set(0, 0.2, 0);
camera.lookAt(0, 0.2, -1);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener("resize", resize);

// Subtle corridor lighting — enough to shape cards without flattening images.
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

// ---- Card generation ----
// Each card is a PlaneGeometry with an image texture. Cards are placed along
// the corridor on one of four surfaces: left wall, right wall, ceiling, floor.
// Spread on the far wall ahead is handled by picking a wide X range at high Z.

const CORRIDOR_SPAN = 260;   // total depth of the corridor in scene units
const WALL_X = 4.8;

// Each wall is divided into fixed-width "slots" so two cards on the same wall
// never overlap — regardless of how each card resizes when its video metadata
// arrives. Slot width is budgeted for the widest possible card (tallest card
// × widest landscape aspect ≈ 3.4 × 1.35 ≈ 4.6). A small gap between slots.
const SLOT_W = 5.2;
const SLOT_GAP = 1;
const SLOT_STEP = SLOT_W + SLOT_GAP;

// Start each wall a little ahead of the camera; offset the right wall by half
// a step so cards on opposite walls are interleaved rather than paired up.
const wallCursor = { left: -5, right: -5 - SLOT_STEP / 2 };

function nextSlotZ(side) {
  const z = wallCursor[side] - SLOT_W / 2;
  wallCursor[side] -= SLOT_STEP;
  return z;
}

// Enough cards to fill the corridor on both walls at initial layout.
const CARD_COUNT = Math.floor((CORRIDOR_SPAN / SLOT_STEP) * 2);

const cards = [];
const cardGroup = new THREE.Group();
scene.add(cardGroup);

// ---- Video assets ----
// One <video> element per unique project, shared across every card that
// references it. All are muted/looping/autoplaying so the gallery feels alive
// while the user walks. Each gets a THREE.VideoTexture.
//
// Each project *also* has a Picsum poster as fallback. That poster is what
// cards render with until the video actually starts playing — which means
// the gallery always looks alive even if opened over file:// (where browser
// security blocks video decoding) or while videos are still buffering.
const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

function posterSeed(project) {
  return "rb-" + project.file.replace(/\.\w+$/, "").replace(/\s+/g, "-");
}

const videoCache = new Map();
function getProjectAsset(project) {
  if (videoCache.has(project.file)) return videoCache.get(project.file);

  // Poster texture — always loads because Picsum serves with CORS.
  const posterTex = textureLoader.load(
    `https://picsum.photos/seed/${posterSeed(project)}/600/400`,
    (t) => { t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; }
  );
  posterTex.colorSpace = THREE.SRGBColorSpace;

  // Video element + VideoTexture. On file:// this will error silently and
  // we simply keep showing the poster — the walk animation stays lively.
  const v = document.createElement("video");
  v.src = "./projects/" + encodeURIComponent(project.file);
  v.muted = true;
  v.loop = true;
  v.playsInline = true;
  v.setAttribute("playsinline", "");
  v.autoplay = true;
  v.preload = "auto";
  v.crossOrigin = "anonymous";
  v.style.cssText =
    "position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px;top:-9999px";
  document.body.appendChild(v);
  v.play().catch(() => {});

  const videoTex = new THREE.VideoTexture(v);
  videoTex.colorSpace = THREE.SRGBColorSpace;
  videoTex.minFilter = THREE.LinearFilter;
  videoTex.magFilter = THREE.LinearFilter;
  videoTex.generateMipmaps = false;

  const entry = { video: v, videoTex, posterTex, playing: false };
  videoCache.set(project.file, entry);

  // When we learn the video's real dimensions, resize every card of this
  // project to match — this is what stops portrait videos from being squished
  // into landscape planes.
  v.addEventListener("loadedmetadata", () => {
    if (!v.videoWidth || !v.videoHeight) return;
    const aspect = v.videoWidth / v.videoHeight;
    entry.aspect = aspect;
    for (const c of cards) {
      if (c.userData.project.file === project.file) resizeCardToAspect(c, aspect);
    }
  });

  // Promote every card using this project from poster to video the moment
  // playback actually begins.
  v.addEventListener("playing", () => {
    entry.playing = true;
    for (const c of cards) {
      if (c.userData.project.file === project.file) {
        c.material.map = videoTex;
        c.material.needsUpdate = true;
      }
    }
  });

  return entry;
}

function resizeCardToAspect(card, aspect) {
  const targetH = card.userData.targetH;
  const w = targetH * aspect;
  const h = targetH;
  card.geometry.dispose();
  card.geometry = new THREE.PlaneGeometry(w, h);
  // Rebuild the dark matte back to match.
  const back = card.userData.backMesh;
  if (back) {
    back.geometry.dispose();
    back.geometry = new THREE.PlaneGeometry(w + 0.16, h + 0.16);
  }
  card.userData.size = [w, h];
}
// Warm the cache eagerly so posters + videos begin loading at once.
PROJECTS.forEach(getProjectAsset);

function sidePlacement(kind) {
  // Portrait-biased default — most of the source videos are phone recordings
  // (9:16-ish). Cards are resized precisely once their video's metadata loads.
  const h = rand(2.4, 3.4);
  const w = h * 0.62; // initial portrait guess
  if (kind === "left") {
    return {
      pos: [-WALL_X + rand(-0.1, 0.3), rand(-1.0, 1.6), 0],
      rot: [0, Math.PI / 2, rand(-0.04, 0.04)],
      size: [w, h],
    };
  }
  if (kind === "right") {
    return {
      pos: [WALL_X + rand(-0.3, 0.1), rand(-1.0, 1.6), 0],
      rot: [0, -Math.PI / 2, rand(-0.04, 0.04)],
      size: [w, h],
    };
  }
  return null;
}

const SIDE_BAG = [
  "left", "left", "left",
  "right", "right", "right",

];

function buildCards() {
  // Evenly alternate between walls so each wall gets its fair share of slots.
  const sides = [];
  for (let i = 0; i < CARD_COUNT; i++) sides.push(i % 2 === 0 ? "left" : "right");

  for (let i = 0; i < CARD_COUNT; i++) {
    const project = PROJECTS[i % PROJECTS.length];
    const side = sides[i];
    const place = sidePlacement(side);

    const asset = getProjectAsset(project);
    const geom = new THREE.PlaneGeometry(place.size[0], place.size[1]);
    // Start with the poster so the card is never blank. The 'playing' event
    // handler upgrades it to the video texture when (and only when) the
    // video actually starts playing.
    const initialMap = asset.playing ? asset.videoTex : asset.posterTex;
    const mat = new THREE.MeshBasicMaterial({ map: initialMap, fog: true });
    const mesh = new THREE.Mesh(geom, mat);

    const z = nextSlotZ(side);
    mesh.position.set(place.pos[0], place.pos[1], z);
    mesh.rotation.set(place.rot[0], place.rot[1], place.rot[2]);

    // Dark frame around each card — reads as a matted photo in the gallery.
    const backGeom = new THREE.PlaneGeometry(
      place.size[0] + 0.16,
      place.size[1] + 0.16
    );
    const backMat = new THREE.MeshBasicMaterial({ color: 0x1a1a17, fog: true });
    const back = new THREE.Mesh(backGeom, backMat);
    back.position.z = -0.01;
    mesh.add(back);

    mesh.userData.project = project;
    mesh.userData.side = side;
    mesh.userData.size = place.size;
    mesh.userData.targetH = place.size[1]; // preserve per-card height for later resize
    mesh.userData.backMesh = back;
    mesh.userData.baseRot = [...place.rot];

    cardGroup.add(mesh);
    cards.push(mesh);

    // If the video's metadata already arrived before the card was built,
    // apply the real aspect right away.
    if (asset.aspect) resizeCardToAspect(mesh, asset.aspect);
  }
}
buildCards();

// ---- Camera motion (scroll-driven, GSAP-smoothed) ----
// The camera's target Z only changes on user input. GSAP tweens the actual Z
// toward the target with a short ease, so motion is buttery but comes to rest
// as soon as the user stops scrolling.
let targetZ = camera.position.z;
let activeTween = null;

const WHEEL_SENS = 0.012;
const EASE_DURATION = 0.55;

function nudge(delta) {
  targetZ -= delta; // negative delta advances the camera into -Z
  if (activeTween) activeTween.kill();
  activeTween = gsap.to(camera.position, {
    z: targetZ,
    duration: EASE_DURATION,
    ease: "power2.out",
    onUpdate: recycleIfNeeded,
  });
}

function recycleIfNeeded() {
  // When a card has passed the camera, move it to the far end of its wall,
  // into the next available slot. Stays on the SAME wall so the slot system
  // keeps its non-overlap guarantee.
  for (const c of cards) {
    if (c.position.z > camera.position.z + 4) {
      const side = c.userData.side;
      const place = sidePlacement(side);
      c.position.x = place.pos[0];
      c.position.y = place.pos[1];
      c.position.z = nextSlotZ(side);
      c.rotation.set(place.rot[0], place.rot[1], place.rot[2]);
      c.userData.baseRot = [...place.rot];
    }
  }
}

// ---- Modal state (so scroll/keys are blocked while it's open) ----
let modalOpen = false;

window.addEventListener("wheel", (e) => {
  if (modalOpen) return; // let the modal scroll naturally if the user tries
  e.preventDefault();
  nudge(e.deltaY * WHEEL_SENS);
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalOpen) { closeModal(); return; }
  if (modalOpen) return;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    nudge(-1.8); e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    nudge(1.8); e.preventDefault();
  }
});

// Touch
let lastTouchY = null;
window.addEventListener("touchstart", (e) => {
  if (modalOpen) return;
  lastTouchY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (modalOpen || lastTouchY === null) return;
  const y = e.touches[0].clientY;
  nudge((lastTouchY - y) * 0.04);
  lastTouchY = y;
  e.preventDefault();
}, { passive: false });
window.addEventListener("touchend", () => { lastTouchY = null; });

// ---- Hover detection via raycaster ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const overlay = document.getElementById("overlay");
const ovTags = document.getElementById("ov-tags");
const ovTitle = document.getElementById("ov-title");
const ovDesc = document.getElementById("ov-desc");
const ovKind = document.getElementById("ov-kind");
const cursorDot = document.getElementById("cursor");

let hovered = null;
let overlayShown = false;

function setOverlay(project) {
  ovTags.innerHTML = "";
  project.tags.forEach((t) => {
    const s = document.createElement("span");
    s.textContent = t;
    ovTags.appendChild(s);
  });
  ovTitle.textContent = project.title;
  ovDesc.textContent = project.desc;
  ovKind.textContent = project.kind;
}

window.addEventListener("pointermove", (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  cursorDot.style.left = e.clientX + "px";
  cursorDot.style.top = e.clientY + "px";

  // Position overlay with a small offset from the cursor; flip side if near
  // the right edge so it never falls off-screen.
  const ox = e.clientX + 22;
  const oy = e.clientY + 18;
  const w = 340;
  const flipped = ox + w + 20 > window.innerWidth;
  const left = flipped ? e.clientX - w - 22 : ox;
  overlay.style.transform = `translate3d(${left}px, ${oy}px, 0)`;
});

function updateHover() {
  if (modalOpen) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cards, false);
  const first = hits.find(
    (h) => h.object.position.z > camera.position.z - 40 &&
           h.object.position.z < camera.position.z
  );
  const target = first ? first.object : null;

  if (target !== hovered) {
    // Ease the previous card back to rest
    if (hovered) {
      const br = hovered.userData.baseRot;
      gsap.to(hovered.scale, { x: 1, y: 1, z: 1, duration: 0.4, ease: "power3.out" });
      gsap.to(hovered.rotation, {
        x: br[0], y: br[1], z: br[2],
        duration: 0.4, ease: "power3.out",
      });
    }
    hovered = target;
    if (hovered) {
      setOverlay(hovered.userData.project);
      gsap.to(overlay, { opacity: 1, duration: 0.2, ease: "power2.out" });
      gsap.to(hovered.scale, { x: 1.06, y: 1.06, z: 1.06, duration: 0.4, ease: "power3.out" });
      document.body.classList.add("card-hover");
      overlayShown = true;
    } else {
      gsap.to(overlay, { opacity: 0, duration: 0.18, ease: "power2.out" });
      document.body.classList.remove("card-hover");
      overlayShown = false;
    }
  }
}

// ---- Click-to-expand: open the full video in a modal ----
const modal = document.getElementById("modal");
const modalVideo = document.getElementById("modal-video");
const modalClose = document.getElementById("modal-close");
const modalTitle = document.getElementById("modal-title");
const modalDesc = document.getElementById("modal-desc");
const modalTags = document.getElementById("modal-tags");

// Track pointer so we can distinguish a click (no drag) from a swipe.
let pressX = 0, pressY = 0, pressTime = 0;
canvas.addEventListener("pointerdown", (e) => {
  pressX = e.clientX; pressY = e.clientY; pressTime = performance.now();
});
canvas.addEventListener("pointerup", (e) => {
  if (modalOpen) return;
  const dx = e.clientX - pressX, dy = e.clientY - pressY;
  const dt = performance.now() - pressTime;
  if (Math.hypot(dx, dy) > 6 || dt > 600) return; // treat as drag, not click

  // Reuse the current mouse NDC (already set on pointermove) to pick a card.
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cards, false);
  const first = hits.find(
    (h) => h.object.position.z > camera.position.z - 40 &&
           h.object.position.z < camera.position.z
  );
  if (first) openModal(first.object.userData.project);
});

function openModal(project) {
  modalOpen = true;
  document.body.classList.add("modal-open");

  // Clear hover state so the small tooltip disappears underneath and the
  // previously scaled card eases back to rest.
  if (hovered) {
    const br = hovered.userData.baseRot;
    gsap.to(hovered.scale, { x: 1, y: 1, z: 1, duration: 0.3, ease: "power3.out" });
    gsap.to(hovered.rotation, { x: br[0], y: br[1], z: br[2], duration: 0.3, ease: "power3.out" });
    hovered = null;
  }
  gsap.to(overlay, { opacity: 0, duration: 0.15 });
  document.body.classList.remove("card-hover");

  modalTags.innerHTML = "";
  project.tags.forEach((t) => {
    const s = document.createElement("span");
    s.textContent = t;
    modalTags.appendChild(s);
  });
  modalTitle.textContent = project.title;
  modalDesc.textContent = project.desc;

  modalVideo.src = "./projects/" + encodeURIComponent(project.file);
  modalVideo.currentTime = 0;
  modalVideo.muted = false;
  modalVideo.play().catch(() => {});

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  modalClose.focus({ preventScroll: true });
}

function closeModal() {
  modalOpen = false;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  modalVideo.pause();
  // Drop the src so the browser can GC the decoded frames.
  modalVideo.removeAttribute("src");
  modalVideo.load();
}

modalClose.addEventListener("click", closeModal);
// Clicking the dimmed backdrop (but not the frame) also closes.
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

// ---- Render loop ----
// We render every frame: it keeps hover + motion responsive without leaking
// state between ticks. The scene itself is still whenever the user is idle —
// no autonomous animation, so a frozen frame is still frozen.
function tick() {
  updateHover();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>

</body>
</html>
